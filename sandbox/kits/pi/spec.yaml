schemaVersion: "2"
kind: sandbox
name: ai-in-container-pi
displayName: AI in Container - Pi
description: Self-managed Pi Coding Agent running in the ai-in-container Docker Sandbox image.

args:
  image:
    default: ghcr.io/cainiaocome/ai-in-container:docker-sandbox
    description: OCI image containing the self-installed coding agents.

sandbox:
  image: "${{ kit.args.image }}"
  entrypoint: [pi]

agentInstructions:
  filename: AGENTS.md
