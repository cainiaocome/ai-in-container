schemaVersion: "2"
kind: sandbox
name: ai-in-container-codex
displayName: AI in Container - Codex
description: Self-managed Codex CLI running in the ai-in-container Docker Sandbox image.

args:
  image:
    default: ghcr.io/cainiaocome/ai-in-container:docker-sandbox
    description: OCI image containing the self-installed coding agents.

sandbox:
  image: "${{ kit.args.image }}"
  entrypoint: [codex]

agentInstructions:
  filename: AGENTS.md
